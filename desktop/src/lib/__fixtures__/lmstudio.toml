schema_version = 1

[llm_clients.lmstudio]
format = "openai_chat"
base_url = "http://127.0.0.1:1234/v1"
api_key_env = "LM_STUDIO_API_KEY"

[targets.lmstudio_target]
id = "local-model"
llm_client = "lmstudio"

[routes.smart]
id = "switchyard"
type = "passthrough"
