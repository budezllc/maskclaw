name: desktop-installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "engine/**"
      - ".github/workflows/desktop-installer.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "engine/**"
      - ".github/workflows/desktop-installer.yml"

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: x86_64-pc-windows-msvc
      - name: Install NSIS
        run: choco install nsis -y
      - run: npm ci
      - name: Build MASKCLAW DESKTOP installer
        env:
          SWITCHYARD_REFRESH_SIDECAR: "1"
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: maskclaw-desktop-installer
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
