name: engine-aarch64

# Optional CI build. Preferred: appliance/scripts/build-engine-aarch64.ps1 on the Windows builder.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p switchyard-server
      - uses: actions/upload-artifact@v4
        with:
          name: switchyard-server-aarch64
          path: engine/target/release/switchyard-server
